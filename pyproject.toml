[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "group-invariance-testing"
version = "0.1.0"
description = "Research implementation of anytime-valid sequential group-invariance tests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
neural = [
    "torch>=2.0",
]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["group_invariance_testing*"]
